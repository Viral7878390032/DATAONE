
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <link rel="manifest" href="./manifest.json">
  <title>DATAONE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      padding: 24px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 12px 0 32px;
    }
    .logo {
      background: #2563eb;
      padding: 14px;
      border-radius: 14px;
      font-size: 24px;
      font-weight: bold;
    }
    h1 { margin: 0; font-size: 27px; }
    .subtitle { color: #94a3b8; margin-top: 6px; }
    h2 { font-size: 20px; margin-bottom: 18px; }
    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      background: white;
      color: #334155;
      padding: 16px;
      border-radius: 30px;
      text-decoration: none;
      margin-bottom: 30px;
    }
    .search img { width: 25px; height: 25px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .card {
      background: #17243a;
      color: white;
      text-decoration: none;
      border-radius: 18px;
      padding: 22px 16px;
      min-height: 125px;
    }
    .emoji { font-size: 30px; margin-bottom: 15px; }
    .card strong { display: block; margin-bottom: 7px; }
    .card small { color: #94a3b8; }
    footer {
      color: #64748b;
      text-align: center;
      margin-top: 40px;
      font-size: 12px;
    }
    
.menu-toggle {
  position: fixed;
  top: 18px;
  left: 18px;
  z-index: 1001;
  width: 44px;
  height: 44px;
  border: 1px solid #334155;
  border-radius: 12px;
  background: #17243a;
  color: white;
  font-size: 24px;
  cursor: pointer;
}

.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 1003;
  width: 280px;
  padding: 20px;
  background: #101b2e;
  border-right: 1px solid #263650;
  transform: translateX(-100%);
  transition: transform 0.25s ease;
  visibility: hidden;
  overflow-y: auto;
}

.sidebar.open {
  transform: translateX(0);
  visibility: visible;
}

.sidebar-backdrop {
  position: fixed;
  inset: 0;
  z-index: 1002;
  background: #0009;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s ease;
}

.sidebar-backdrop.open {
  opacity: 1;
  visibility: visible;
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 24px;
  border-bottom: 1px solid #263650;
}

.sidebar-brand strong,
.sidebar-brand small {
  display: block;
}

.sidebar-brand small {
  margin-top: 5px;
  color: #94a3b8;
  font-size: 12px;
}

.sidebar-brand .logo {
  padding: 10px;
  color: white;
}

.menu-close {
  margin-left: auto;
  background: transparent;
  border: 0;
  color: white;
  font-size: 28px;
  cursor: pointer;
}

.sidebar-nav {
  display: grid;
  gap: 10px;
  margin-top: 24px;
}

.sidebar-nav a,
.sidebar-nav button {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: #e2e8f0;
  font: inherit;
  text-decoration: none;
  text-align: left;
  cursor: pointer;
}

.sidebar-nav a:hover,
.sidebar-nav button:hover {
  background: #203553;
  color: #93c5fd;
}

#settingsPanel {
  margin-top: 20px;
  padding: 14px;
  border-radius: 12px;
  background: #17243a;
  color: #e2e8f0;
}

#settingsPanel[hidden] {
  display: none;
}

#settingsPanel p {
  font-weight: bold;
}

body.sidebar-open {
  overflow: hidden;
}

body {
  padding-top: 80px;
}

@media (max-width: 480px) {
  .sidebar {
    width: min(280px, 85vw);
  }
}

/* DATAONE premium sidebar upgrade */
:root {
  --sidebar-bg: #0d1628;
  --sidebar-panel: #111e33;
  --sidebar-border: rgba(148, 163, 184, 0.15);
  --sidebar-blue: #60a5fa;
  --sidebar-text: #e2e8f0;
  --sidebar-muted: #94a3b8;
}

.menu-toggle {
  display: grid;
  place-items: center;
  border: 1px solid rgba(96, 165, 250, 0.28);
  background: rgba(17, 30, 51, 0.94);
  box-shadow: 0 8px 28px #0004;
  backdrop-filter: blur(14px);
  transition: background .2s, border-color .2s, transform .2s;
}

.menu-toggle:hover {
  background: #1d3556;
  border-color: var(--sidebar-blue);
  transform: translateY(-1px);
}

.sidebar {
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(ellipse at top left, #1d3c67 0%, transparent 48%),
    var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  box-shadow: 18px 0 60px #0005;
  padding: 24px 16px;
  transition: transform .28s cubic-bezier(.2,.8,.2,1),
              visibility .28s;
}

.sidebar-brand {
  padding: 8px 6px 24px;
  border-bottom-color: var(--sidebar-border);
}

.sidebar-brand strong {
  color: #f8fafc;
  letter-spacing: 1.6px;
  font-size: 17px;
}

.sidebar-brand .logo {
  width: 44px;
  height: 44px;
  box-sizing: border-box;
  display: grid;
  place-items: center;
  border: 1px solid #60a5fa66;
  border-radius: 14px;
  background: linear-gradient(145deg, #2563eb, #172554);
  box-shadow: 0 0 24px #3b82f633;
  font-weight: 800;
  font-size: 19px;
}

.menu-close {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  transition: background .2s, color .2s;
}

.menu-close:hover {
  background: #ffffff12;
  color: #93c5fd;
}

.sidebar-nav {
  gap: 8px;
  margin-top: 26px;
}

.sidebar-nav a,
.sidebar-nav button {
  box-sizing: border-box;
  min-height: 48px;
  border: 1px solid transparent;
  border-radius: 12px;
  color: var(--sidebar-muted);
  font-size: 14px;
  font-weight: 500;
  transition: background .2s, color .2s,
              border-color .2s, transform .2s;
}

.sidebar-nav a:hover,
.sidebar-nav button:hover {
  background: #ffffff09;
  border-color: var(--sidebar-border);
  color: white;
  transform: translateX(3px);
}

.sidebar-nav a[data-page="home"] {
  background: linear-gradient(100deg, #2563eb35, #3b82f60a);
  border-color: #60a5fa35;
  color: #93c5fd;
  box-shadow: inset 3px 0 0 #60a5fa;
}

.sidebar-nav a:focus-visible,
.sidebar-nav button:focus-visible,
.menu-toggle:focus-visible,
.menu-close:focus-visible {
  outline: 2px solid var(--sidebar-blue);
  outline-offset: 3px;
}

#settingsPanel {
  border: 1px solid var(--sidebar-border);
  background: #ffffff08;
  border-radius: 14px;
  padding: 16px;
  font-size: 13px;
  line-height: 1.6;
}

#settingsPanel p {
  margin-top: 0;
  color: #93c5fd;
}

#settingsPanel label {
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
}

#settingsPanel input {
  accent-color: #3b82f6;
}

.sidebar-backdrop {
  background: rgba(2, 6, 23, .72);
  backdrop-filter: blur(3px);
}

@media (prefers-reduced-motion: reduce) {
  .sidebar,
  .sidebar-nav a,
  .sidebar-nav button,
  .menu-toggle {
    transition: none;
  }
}

  </style>
</head>
<body>
  
<button id="menuToggle" class="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button>

<div id="sidebarBackdrop" class="sidebar-backdrop"></div>

<aside id="sidebar" class="sidebar" aria-label="Main menu">
  <div class="sidebar-brand">
    <div class="logo">D</div>
    <div>
      <strong>DATAONE</strong>
      <small>Your digital space</small>
    </div>
    <button id="menuClose" class="menu-close" aria-label="Close menu">×</button>
  </div>

  <nav class="sidebar-nav">
    <a href="#home" data-page="home">🏠 <span>Home</span></a>
    <a href="https://www.google.com/" target="_blank" rel="noopener noreferrer">🌐 <span>Google Search</span></a>
    <a href="https://mail.google.com/" target="_blank" rel="noopener noreferrer">✉️ <span>Gmail</span></a>
    <button id="settingsToggle" type="button">⚙️ <span>Settings</span></button>
  </nav>

  <div id="settingsPanel" hidden>
    <p>DATAONE Settings</p>
    <label>
      <input id="compactMode" type="checkbox">
      Compact cards
    </label>
  </div>
</aside>

  <header>
    <div class="logo">D</div>
    <div>
      <h1>DATAONE</h1>
      <div class="subtitle">Your simple digital space</div>
    </div>
  </header>

  <h2>Search &amp; Explore</h2>

  <a class="search" href="https://www.google.com">
    <img src="https://www.google.com/favicon.ico" alt="Google">
    <span>Search with Google</span>
  </a>

  <div class="grid">
    <a class="card" href="https://www.google.com">
      <div class="emoji">🌐</div>
      <strong>Google Search</strong>
      <small>Find anything online</small>
    </a>

    <a class="card" href="https://mail.google.com">
      <div class="emoji">✉️</div>
      <strong>Gmail</strong>
      <small>Open your email</small>
    </a>
  </div>

  <footer>DATAONE • Version 1.0</footer>
  
<script>
  const sidebar = document.getElementById("sidebar");
  const backdrop = document.getElementById("sidebarBackdrop");
  const menuToggle = document.getElementById("menuToggle");
  const menuClose = document.getElementById("menuClose");
  const settingsToggle = document.getElementById("settingsToggle");
  const settingsPanel = document.getElementById("settingsPanel");
  const compactMode = document.getElementById("compactMode");

  function setSidebar(open) {
    sidebar.classList.toggle("open", open);
    backdrop.classList.toggle("open", open);
    document.body.classList.toggle("sidebar-open", open);
    menuToggle.setAttribute("aria-expanded", String(open));
    menuToggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  }

  menuToggle.addEventListener("click", () => {
    setSidebar(!sidebar.classList.contains("open"));
  });

  menuClose.addEventListener("click", () => setSidebar(false));
  backdrop.addEventListener("click", () => setSidebar(false));

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") setSidebar(false);
  });

  settingsToggle.addEventListener("click", () => {
    settingsPanel.hidden = !settingsPanel.hidden;
  });

  compactMode.addEventListener("change", () => {
    document.querySelectorAll(".card").forEach((card) => {
      card.style.minHeight = compactMode.checked ? "90px" : "";
      card.style.padding = compactMode.checked ? "14px" : "";
    });
  });

  document.querySelector('[data-page="home"]').addEventListener("click", (event) => {
    event.preventDefault();
    setSidebar(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
</script>
</body>

</body>
</html>
